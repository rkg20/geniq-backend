server:
  port: 8081

spring:
  application:
    name: content-service
  datasource:
    url: jdbc:h2:mem:contentdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# Comma separated list of origins allowed to call this service.
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:4173
